# Rebuilds therealflow.tv from the YouTube and podcast feeds and publishes it.
# Runs every 2 hours, on every push to main, and on demand (Actions tab > Publish site > Run workflow).
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write   # to save the episode/video archive back to the repo
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npm run build
      - name: Save new episodes and videos to the archive
        run: |
          git config user.name "therealflow-bot"
          git config user.email "therealflow-bot@users.noreply.github.com"
          git add data/episodes.json data/videos.json data/show.json data/indexed.json
          if git diff --cached --quiet; then
            echo "No new content."
          else
            git commit -m "Archive new episodes and videos [skip ci]"
            git push
          fi
      - name: Announce new pages to search engines (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
